<!DOCTYPE html>
<html>
<head>
    <title>HTML Forms</title>
</head>
<body>

<h2>HTML Forms</h2>

<div style="width: 360px; height: 200px; overflow-y: scroll; overflow-x: hidden; border: 2px solid gray; padding: 10px;">

<form action="/action_page.php">

  <label for="fname" style="display: inline-block; width: 70px; vertical-align: top;">Name:</label>
  <input type="text" id="fname" name="fname" value="your name here" style="width: 230px; margin-bottom: 8px;"><br>

  <label for="ename" style="display: inline-block; width: 70px; vertical-align: top;">Email:</label>
  <input type="text" id="ename" name="ename" value="your email here" style="width: 250px; margin-bottom: 8px;"><br>

  <label for="aname" style="display: inline-block; width: 70px; vertical-align: middle;">Address:</label>
  <textarea id="aname" name="aname" rows="4" cols="50" style="width: 250px; height: 75px; overflow-y: scroll; border: 2px solid gray; vertical-align: middle; margin-bottom: 8px;">25 Nowhere Street 
Somewhere 
Not Here 
Y2K 5RU
</textarea><br>
  
  <label for="pname" style="display: inline-block; width: 70px; vertical-align: top;">Postcode:</label>
  <input type="text" id="pname" name="pname" value="postal code" style="width: 150px; margin-bottom: 8px;"><br><br>

</form> 

</div>
</body>
</html>
