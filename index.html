<!DOCTYPE html> <!--base style css in line-->
<html>
<head>
    <title>Layout Tabel</title>
</head>
<body style="font-family: Arial, sans-serif;">

    <table style="border-collapse: collapse; margin: 10px;">

        <tr> <!--colspan 2 itu untuk menggabungkan 2 sel-->
            <td colspan="2" style="background-color: #fadfc3; border: 1px solid #ff9900; text-align: center; padding: 5px; font-size: 12px;">
                <p>HEADER</p>
            </td>
        </tr>

        <tr>
            <td colspan="2" style="background-color: #d9e6f9; border: 1px solid #73a2ff; text-align: center; padding: 5px; font-size: 11px;">
                <p>NAVIGASI</p>
            </td>
        </tr>

        <tr>
            <td style="width: 400px; height: 180px; background-color: #f5c4c4; border: 1px solid #dd6e57; padding: 40px;">
                <main>
                    <h2 style="margin-top: 0; font-size: 24px;">Heading 1</h2>
                    <p style="font-size: 13px; margin-bottom: 50px;">
                        Lorem ipsum dolor sit amet, consectetur<br> <!--br buat enter-->
                        adipisicing elit, sed do eiusmod tempor<br>
                        incididunt ut labore et dolore magna aliqua.
                    </p>
                </main>
            </td>

            <td style="width: 120px; background-color: #d4f1d1; border: 1px solid #8bbd8b; padding: 8px 4px;">
                <aside>
                    <b style="font-size: 12px;">Menu:</b>
                    <ul style="font-size: 12px; padding-left: 40px;">
                        <li>Home</li> <!--li itu untuk membuat item daftar-->
                        <li>Berita</li>
                        <li>Layanan</li>
                        <li>Kontak</li>
                    </ul>
                </aside>
            </td>
        </tr>

        <tr>
            <td colspan="2" style="background-color: #fadfc3; border: 1px solid #ff9900; text-align: center; padding: 5px; font-size: 12px;">
                <p>FOOTER</p>
            </td>
        </tr>

    </table>

</body>
</html>
